    '--wb-stage': '#0B0F0C', '--wb-bg': '#101913', '--wb-blob': '#101913',
    '--wb-stroke': '#414B45', '--wb-ghost': '#152B1D', '--wb-ghost-opacity': '0.4',
    '--wb-label': '#EEF4F0', '--wb-label-alt': '#FFFFFF', '--wb-label-on-accent': '#101913',
    '--wb-line': '#414B45', '--wb-accent': '#B8FF00'
  },
  light: {
    '--wb-stage': '#F2F5F3', '--wb-bg': '#FFFFFF', '--wb-blob': '#FFFFFF',
    '--wb-stroke': '#BEC8C2', '--wb-ghost': '#EEF4F0', '--wb-ghost-opacity': '0.5',
    '--wb-label': '#414B45', '--wb-label-alt': '#414B45', '--wb-label-on-accent': '#232825',
    '--wb-line': '#BEC8C2', '--wb-accent': '#9BD700'
  }
};

const allowed = (a, b) => PAIRS.some(p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a));

// Math.hypot es ~9x mas lento que sqrt en V8 (hace escalado anti-desbordamiento
// que aqui no hace falta: las coordenadas van de 0 a ~700). En el bucle de
// colisiones se llama decenas de miles de veces por frame.
function hyp(x, y) { return Math.sqrt(x * x + y * y); }

// Rascaderos de módulo. El paso físico pedía ~420 objetos {x,y} y 72 arrays
// nuevos por frame sólo para guardar resultados intermedios: esa basura es la
// que hace que el recolector se meta en medio de un scroll y se vea el tirón.
// _cA/_cB son la pareja del bucle de colisiones y del tope de solape; _cC es
// para los sitios donde sólo hay un centroide vivo a la vez (kShape y spin).
const _cA = { x: 0, y: 0 }, _cB = { x: 0, y: 0 }, _cC = { x: 0, y: 0 };
const _NX = new Float64Array(N), _NY = new Float64Array(N);

function polyArea(P) {
  let a = 0;
  for (let i = 0; i < N; i++) { const j = (i + 1) % N; a += P[i].x * P[j].y - P[j].x * P[i].y; }
  return Math.abs(a / 2);
}
function segNearest(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy || 1e-9;
  let t = ((px - ax) * dx + (py - ay) * dy) / L; t = t < 0 ? 0 : t > 1 ? 1 : t;
  return { x: ax + dx * t, y: ay + dy * t };
}
function pointInPoly(px, py, P) {
  let c = false;
  for (let i = 0, j = N - 1; i < N; j = i++) {
    if (((P[i].y > py) !== (P[j].y > py)) && (px < (P[j].x - P[i].x) * (py - P[i].y) / (P[j].y - P[i].y) + P[i].x)) c = !c;
  }
  return c;
}
// toFixed(2) pasa por el formateador de números y devuelve siempre dos
// decimales ("12.00"): son ~590 llamadas y ~590 cadenas por frame. Redondear a
// centésimas da la misma geometría y además una `d` más corta que parsear.
const r2 = v => Math.round(v * 100) / 100;
function ringPath(P) {
  let d = 'M' + r2(P[0].x) + ' ' + r2(P[0].y);
  for (let i = 0; i < N; i++) {
    const p0 = P[(i - 1 + N) % N], p1 = P[i], p2 = P[(i + 1) % N], p3 = P[(i + 2) % N];
    d += 'C' + r2(p1.x + (p2.x - p0.x) * K_CR) + ' ' + r2(p1.y + (p2.y - p0.y) * K_CR)
      + ',' + r2(p2.x - (p3.x - p1.x) * K_CR) + ' ' + r2(p2.y - (p3.y - p1.y) * K_CR)
      + ',' + r2(p2.x) + ' ' + r2(p2.y);
  }
  return d + 'Z';
}

class Component extends DCLogic {
  rootRef = React.createRef();
  statusRef = React.createRef();
  detailRef = React.createRef();

  applyTheme() {
    // El tema lo hereda del documento anfitrión (variables --wb-* definidas en la página).
  }

  componentDidMount() { this.applyTheme(); this.build(); }
  componentDidUpdate(prev) {
    this.applyTheme();
    this.paintSupports();
    if (prev && prev.strategy !== this.props.strategy) this.onReplay();
  }
  componentWillUnmount() {
    this.stopped = true;
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
    if (this.onDragMove) window.removeEventListener('pointermove', this.onDragMove);
    if (this.onDragUp) {
      window.removeEventListener('pointerup', this.onDragUp);
      window.removeEventListener('pointercancel', this.onDragUp);
    }
    if (this.onTouchMove && this.blobs) {
      this.blobs.forEach(b => b.g.removeEventListener('touchmove', this.onTouchMove));
    }
  }

  // Las reservas de aquí abajo son las MISMAS que el componente declara en su
  // data-props, que es lo que se aplica cuando se abre suelto. Al incrustarlo
  // con <dc-import> sin atributos, el runtime no aplica el data-props y entraba
  // otra tanda de valores: strategy 'cunas' en vez de 'imanes' (que es otro
  // mecanismo de aterrizaje entero, sin imanes), gravedad 0.15, el imán entrando
  // a los 0.9 s y con rampa de 0.7 s. Resultado: los blobs se posaban en vez de
  // caer, chocar y ser recogidos de golpe. Ahora coinciden.
  soft() { return (this.props.softness == null ? 100 : this.props.softness) / 100; }
  grav() { return (this.props.gravity == null ? 0.3 : this.props.gravity) * 0.6; }
  strategy() { return this.props.strategy || 'imanes'; }
  useCradles() { return this.strategy().indexOf('cunas') === 0; }
  useSequence() { return this.strategy() === 'cunas+secuencia'; }
  settleK() {
    const manual = this.props.settle == null ? 0 : this.props.settle;
    return this.strategy() === 'imanes' ? Math.max(manual, 0.6) : manual;
  }
  labelK() { return this.props.labelSquash == null ? 1 : this.props.labelSquash; }
  uprightK() { return this.props.upright == null ? 0.55 : this.props.upright; }
  tiltMax() { return (this.props.labelMaxTilt == null ? 35 : this.props.labelMaxTilt) * Math.PI / 180; }

  // rotación del blob respecto a su orientación de diseño (0 = como en Figma)
  spin(b) {
    // el centroide devuelto es el rascadero _cC: sólo vale hasta el siguiente
    // spin(), y quien lo usa (el par de enderezado) lo consume en el acto
    const c = this.centroidI(b, _cC);
    let sn = 0, sd = 0;
    for (let i = 0; i < N; i++) {
      const q = b.q0[i], px = b.P[i].x - c.x, py = b.P[i].y - c.y;
      sn += q.x * py - q.y * px; sd += q.x * px + q.y * py;
    }
    return { th: Math.atan2(sn, sd), c: c };
  }

  // 0 durante la caída libre, 1 cuando el imán está a plena fuerza
  magnetRamp() {
    const delay = (this.props.magnetDelay == null ? 1 : this.props.magnetDelay) * 60;
    const fade = Math.max(1, (this.props.magnetFade == null ? 0.2 : this.props.magnetFade) * 60);
    const t = (this.frames - delay) / fade;
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return t * t * (3 - 2 * t);
  }

  build() {
    const root = this.rootRef.current;
    if (!root) return;
    this.supportsG = root.querySelector('[data-role="supports"]');
    this.ghostsG = root.querySelector('[data-role="ghosts"]');

    this.blobs = RINGS.map(r => {
      const g = root.querySelector('[data-blob="' + r.id + '"]');
      const shape = g.querySelector('[data-role="shape"]');
      const P = r.ring.map(pt => ({ x: pt[0], y: pt[1], px: pt[0], py: pt[1] }));
      let c0x = 0, c0y = 0;
      r.ring.forEach(pt => { c0x += pt[0]; c0y += pt[1]; });
      c0x /= N; c0y /= N;
      const q0 = r.ring.map(pt => ({ x: pt[0] - c0x, y: pt[1] - c0y }));
      const rest = [], rest2 = [];
      for (let i = 0; i < N; i++) {
        const j = (i + 1) % N, k = (i + 2) % N;
        rest.push(hyp(r.ring[j][0] - r.ring[i][0], r.ring[j][1] - r.ring[i][1]));
        rest2.push(hyp(r.ring[k][0] - r.ring[i][0], r.ring[k][1] - r.ring[i][1]));
      }
      let Q11 = 0, Q12 = 0, Q22 = 0;
      q0.forEach(q => { Q11 += q.x * q.x; Q12 += q.x * q.y; Q22 += q.y * q.y; });
      const det = Q11 * Q22 - Q12 * Q12;
      const A0 = polyArea(P), rEq = Math.sqrt(A0 / Math.PI);
      const t = TARGET[r.id];
      return {
        id: r.id, P: P, q0: q0, rest: rest, rest2: rest2,
        c0: { x: c0x, y: c0y }, A0: A0, r: rEq, bulge: rEq * BULGE,
        Qi: { a: Q22 / det, b: -Q12 / det, d: Q11 / det },
        // cuna: arco cóncavo cuyo punto más bajo toca el borde inferior del destino
        cradle: { cx: t[0], cy: t[1] + rEq - CRADLE_R * rEq, R: CRADLE_R * rEq, span: CRADLE_SPAN * CRADLE_R * rEq },
        release: 0,
        g: g, shape: shape, label: g.querySelector('[data-role="label"]'),
        restD: shape.getAttribute('d')
      };
    });

    this.setupMerge(root);
    this.setupDrag(root);
    this.setupLabelLayer(root);
    this.setupActive(root);

    // secuencia: primero los destinos más bajos
    const order = this.blobs.slice().sort((a, b) => TARGET[b.id][1] - TARGET[a.id][1]);
    order.forEach((b, i) => { b.seq = i * 22; });

    this.paintSupports();
    // Arranca al entrar en pantalla (30 %) y, además, el bucle se detiene
    // mientras el clúster está fuera de la vista: en móvil el simulador ya no
    // consume nada mientras se recorre el resto de la página.
    this.io = new IntersectionObserver(es => {
      es.forEach(e => {
        if (e.intersectionRatio >= 0.3 && !this.started) this.start();
        this.offscreen = !e.isIntersecting;
        this.kick();
      });
    }, { threshold: [0, 0.3] });
    this.io.observe(root);
    this.kick();
  }

  // ─── FUSIÓN de parejas permitidas ───────────────────────────
  // El trazo de cada blob se dibuja en una capa propia, por encima de todos
  // los rellenos, y se enmascara con la silueta de su pareja: lo que cae
  // dentro del otro desaparece. Queda el contorno de la unión, con la
  // esquina en pico donde se cruzan. La máscara es gris progresivo, así el
  // borrado sigue al solape y vuelve si se separan.
  setupMerge(root) {
    const defs = root.querySelector('[data-role="mergedefs"]');
    const layer = root.querySelector('[data-role="mergestrokes"]');
    // Las parejas del tope de solape no dependen del DOM de la fusión, así que
    // se resuelven antes de la salida temprana. capOverlap hacía cuatro
    // búsquedas por id en cada llamada: 48 recorridos con cierre por paso.
    this.capPairs = PAIRS.map(pr => {
      const A = this.blobs.find(b => b.id === pr[0]), B = this.blobs.find(b => b.id === pr[1]);
      return (A && B) ? { A: A, B: B } : null;
    }).filter(Boolean);
    if (!defs || !layer) return;
    this.pairs = PAIRS.map(pr => {
      const A = this.blobs.find(b => b.id === pr[0]), B = this.blobs.find(b => b.id === pr[1]);
      if (!A || !B) return null;
      A.mate = B; B.mate = A;
      return { A: A, B: B };
    }).filter(Boolean);

    const merged = this.blobs.filter(b => b.mate);
    // La máscara solo tiene que cubrir el trazo, y los blobs no pueden salir
    // de [0,W]x[0,FLOOR] (paredes y suelo). Con 24 px de margen sobra, y el
    // área a rasterizar baja de 1129x1334 a 377x582: en móvil eso es la
    // diferencia entre 60 fps y atascarse.
    const MPAD = 24, MW = W + MPAD * 2, MH = H + MPAD * 2;
    defs.innerHTML = merged.map(b =>
      '<' + 'mask id="wbm-cut-' + b.id + '" maskUnits="userSpaceOnUse" x="' + (-MPAD) + '" y="' + (-MPAD) + '" width="' + MW + '" height="' + MH + '">'
      + '<' + 'rect x="' + (-MPAD) + '" y="' + (-MPAD) + '" width="' + MW + '" height="' + MH + '" fill="#fff"></rect>'
      + '<' + 'path data-cut="' + b.id + '" fill="#000" d=""></path></mask>').join('');
    layer.innerHTML = merged.map(b => {
      const st = b.shape.style.stroke || 'var(--wb-stroke,#414B45)';
      return '<' + 'path data-stroke="' + b.id + '" mask="url(#wbm-cut-' + b.id + ')" fill="none" style="stroke:'
        + st + ';stroke-width:' + (b.shape.style.strokeWidth || 1) + ';" d=""></path>';
    }).join('');
    merged.forEach(b => {
      b.strokeP = layer.querySelector('[data-stroke="' + b.id + '"]');
      b.cutP = defs.querySelector('[data-cut="' + b.id + '"]');
      b.maskEl = b.cutP.parentNode;
      b.maskRect = b.maskEl.querySelector('rect');
      b.maskUrl = 'url(#wbm-cut-' + b.id + ')';   // para poder quitar y devolver la máscara
      b.cutOn = true;
      b.shape.style.stroke = 'none';   // el trazo vive ahora en la capa de arriba
    });
  }

  // ─── ESTADO ACTIVO (hover en desktop, tap en táctil) ────────
  // Relleno y trazo pasan a accent, la etiqueta al color sobre accent.
  // El blob activo sube por encima de los demás rellenos (nunca por encima
  // de la capa de trazos) para que su silueta se vea completa.
  // ─── ARRASTRE con correa ────────────────────────────────────
  // El puntero no coloca el blob: tira de él con un resorte. El imán sigue
  // trabajando en contra, y el desplazamiento está limitado a una correa
  // (dragLeash px alrededor del destino), así que nunca sale de su sitio.
  // Al soltar, el imán lo devuelve con la inercia y el wobble de la física.
  setupDrag(root) {
    const svg = root.querySelector('svg[data-scene]');
    if (!svg) return;
    this.drag = null;
    // CÓMO SE LE GANA EL GESTO VERTICAL AL SCROLL (y por qué no de otra forma).
    // Dos callejones sin salida que ya se recorrieron, no volver a ellos:
    //   1. e.preventDefault() sobre 'pointermove' NO cancela el scroll. Con
    //      Pointer Events el scroll se gobierna SOLO por touch-action o por el
    //      preventDefault del 'touchmove' nativo. El de abajo se conserva para
    //      la selección de texto, pero para el scroll siempre fue un no-op.
    //   2. touch-action en un elemento hijo del <svg> lo ignora Chrome: el
    //      valor se lee del layout box y los elementos internos del SVG no
    //      generan uno. Ponerlo en el <svg> raíz sí funciona, pero mata el
    //      scroll en todo el marco del clúster (ya pasó una vez).
    // Lo que sí funciona: un 'touchmove' NO PASIVO en cada grupo de blob. El
    // touch conserva como target el elemento donde EMPEZÓ, así que este
    // listener solo ve los gestos nacidos dentro de un blob y puede cancelar
    // el scroll antes de que arranque. Los gestos del hueco no lo tocan y
    // siguen por la vía rápida del compositor, con su inercia intacta.
    // Colgarlo del grupo y no de window/svg es deliberado: marca como
    // "bloqueante" solo la silueta de los blobs, no todo el clúster.
    this.onTouchMove = e => { if (this.drag && e.cancelable) e.preventDefault(); };
    this.blobs.forEach(b => {
      b.g.style.touchAction = 'none';   // inútil en Chrome, correcto donde sí se respeta
      b.g.addEventListener('touchmove', this.onTouchMove, { passive: false });
    });
    this.svgEl = svg;
    // El rect y el viewBox se leen UNA vez al agarrar, no en cada pointermove:
    // getBoundingClientRect con mutaciones SVG pendientes fuerza layout síncrono
    // del subárbol entero, y el arrastre llega a 120 Hz. El rect cacheado se
    // mantiene válido durante todo el gesto porque mientras el dedo está sobre
    // un blob la página NO se mueve: no hay scroll que desactualice la medida.
    this.toSvg = e => {
      const r = this.rectCache || (this.rectCache = svg.getBoundingClientRect());
      const vb = svg.viewBox.baseVal;
      return {
        x: (e.clientX - r.left) / (r.width || 1) * vb.width,
        y: (e.clientY - r.top) / (r.height || 1) * vb.height
      };
    };
    this.onDragMove = e => {
      const d = this.drag;
      if (!d) return;
      const p = this.toSvg(e);
      d.x = p.x; d.y = p.y;
      d.moved = Math.max(d.moved, hyp(p.x - d.x0, p.y - d.y0));
      if (!d.own) {
        // Zona muerta antes de dar el gesto por arrastre. Estaba en 6 y se
        // notaba como si hubiera que "mantener pulsado" el blob: con 3 el
        // arrastre engancha casi al instante. Ya no hay que decidir de quién
        // es el gesto (el touch-action del grupo lo resolvió en el
        // pointerdown), solo cuándo deja de ser un tap.
        const ZONA = 3;
        const dx = Math.abs(p.x - d.x0), dy = Math.abs(p.y - d.y0);
        if (dx > ZONA || dy > ZONA) d.own = true;
      }
      // En cuanto el gesto se confirma como arrastre, el blob se pone verde y
      // se queda así al soltar. Se hace aquí y no en grab() para no encender
      // el color en un tap corto, y para que un tap sobre un blob ya verde
      // pueda apagarlo. setActive apaga el anterior: solo uno verde a la vez.
      if (d.own && !d.pintado) { d.pintado = 1; this.setActive(d.b.id); }
      // El tope de la correa NO suelta el gesto ni lo reparte con el scroll:
      // mientras el dedo siga sobre el blob, el blob manda y la página no se
      // mueve. Pasado el tope el blob simplemente deja de estirarse (lo clampa
      // step()) y se queda sostenido ahí hasta que se levanta el dedo. Para
      // scrollear hay que soltar y empezar el gesto en el hueco entre blobs.
      if (d.own && e.cancelable) e.preventDefault();
    };
    this.onDragUp = e => {
      const d = this.drag;
      if (!d) return;
      this.drag = null;
      document.body.style.cursor = '';
      // Un toque corto alterna el verde. Tras un arrastre no se toca nada: el
      // blob vuelve a su sitio por física y se queda verde.
      if (d.moved < 4) this.setActive(d.wasActive ? null : d.b.id);
    };
    window.addEventListener('pointermove', this.onDragMove, { passive: false });
    window.addEventListener('pointerup', this.onDragUp);
    window.addEventListener('pointercancel', this.onDragUp);
  }

  grab(b, e) {
    if (!this.toSvg) return;
    // El rect se vuelve a medir en cada gesto, y tiene que ser ANTES del toSvg
    // de abajo, no después: entre un gesto y el siguiente la página sí pudo
    // haber scrolleado, y con el rect del gesto anterior el punto de agarre
    // sale desplazado.
    this.rectCache = null;
    const p = this.toSvg(e), c = this.centroid(b);
    let ni = 0, nd = 1e9;
    for (let i = 0; i < N; i++) {
      const d = hyp(b.P[i].x - p.x, b.P[i].y - p.y);
      if (d < nd) { nd = d; ni = i; }
    }
    this.drag = {
      b: b, i: ni, ox: c.x - p.x, oy: c.y - p.y,
      x: p.x, y: p.y, x0: p.x, y0: p.y, moved: 0, wasActive: this.active === b.id
    };
    this.wake();   // si estaba posado y dormido, el arrastre lo reanima
    document.body.style.cursor = 'grabbing';
  }

  // los labels viven en su propia capa por encima de todos los rellenos:
  // al subir el blob activo, su relleno ya no puede tapar el label del vecino
  setupLabelLayer(root) {
    const strokes = root.querySelector('[data-role="mergestrokes"]');
    if (!strokes || !strokes.parentNode) return;
    const layer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    layer.setAttribute('data-role', 'labels');
    layer.style.pointerEvents = 'none';
    strokes.parentNode.insertBefore(layer, strokes.nextSibling);
    this.blobs.forEach(b => layer.appendChild(b.label));
  }

  setupActive(root) {
    this.mergeAnchor = root.querySelector('[data-role="mergedefs"]');
    this.active = null;
    this.blobs.forEach(b => {
      const strokeEl = b.strokeP || b.shape;
      b.labelPaths = Array.prototype.slice.call(b.label.querySelectorAll('path,text'));
      b.base = {
        fill: b.shape.style.fill,
        stroke: strokeEl.style.stroke,
        label: b.labelPaths.length ? b.labelPaths[0].style.fill : 'var(--wb-label,#EEF4F0)'
      };
      // Aquí se declaraba 'fill 0ms linear' en la forma, el trazo y CADA path de
      // etiqueta. Con 0 ms no animaban nada, pero el motor tenía que llevar la
      // contabilidad de transiciones de ~40 nodos SVG en cada recálculo de
      // estilo, y el cruce dark→light recalcula el documento entero en cada
      // frame de scroll. El color sigue cambiando igual de golpe sin ellas.
      b.g.style.cursor = 'grab';
      b.g.addEventListener('pointerdown', e => this.grab(b, e));
    });
  }

  setActive(id) {
    if (this.active === id || !this.blobs) return;
    this.active = id;
    const gen = (this.activeGen = (this.activeGen || 0) + 1);
    const hit = id != null ? this.blobs.find(x => x.id === id) : null;
    const paint = () => {
      if (this.activeGen !== gen) return;
      for (const b of this.blobs) {
        const on = b.id === id;
        b.shape.style.fill = on ? 'var(--wb-accent,#B8FF00)' : b.base.fill;
        (b.strokeP || b.shape).style.stroke = on ? 'var(--wb-accent,#B8FF00)' : b.base.stroke;
        b.labelPaths.forEach(p => { p.style.fill = on ? 'var(--wb-label-on-accent,#101913)' : b.base.label; });
      }
    };
    if (hit) {
      // primero se sube el nodo y el color entra en el frame siguiente. Aquí
      // había un getBoundingClientRect() para cortar la transición en curso;
      // ya no hay transiciones que cortar y esa lectura forzaba un layout
      // síncrono del SVG entero justo al pasar el puntero.
      this.raise(hit);
      requestAnimationFrame(paint);
    } else paint();
  }

  raise(b) {
    const a = this.mergeAnchor;
    if (a && a.parentNode === b.g.parentNode && b.g.nextSibling !== a) a.parentNode.insertBefore(b.g, a);
  }

  // 0 = tangentes, 1 = concéntricas. El diseño final ronda 0.23
  overlapFrac(A, B, atRest) {
    const ca = atRest ? A.c0 : this.centroid(A), cb = atRest ? B.c0 : this.centroid(B);
    const sum = A.r + B.r;
    return Math.max(0, (sum - hyp(cb.x - ca.x, cb.y - ca.y)) / sum);
  }

  mergeK(A, B, atRest) {
    const thr = (this.props.mergeStart == null ? 5 : this.props.mergeStart) / 100;
    const rng = Math.max(0.01, (this.props.mergeRange == null ? 5 : this.props.mergeRange) / 100);
    return Math.min(1, Math.max(0, (this.overlapFrac(A, B, atRest) - thr) / rng));
  }

  drawMerge(dOf, atRest) {
    if (!this.pairs) return;
    for (const pr of this.pairs) {
      const k = this.mergeK(pr.A, pr.B, atRest);
      // desenrollado: el [pr.A, pr.B] de antes era un array nuevo por pareja y frame
      this.drawCut(pr.A, k, dOf);
      this.drawCut(pr.B, k, dOf);
    }
  }

  // Mientras no hay solape (k = 0) la máscara es la identidad: su rect blanco
  // lo deja todo visible y el path negro va a fill-opacity 0. Rasterizarla en
  // cada frame de toda la caída no pintaba nada distinto de quitarla, así que
  // se quita, y con ella el trazado de la silueta de la pareja y el fitMask.
  drawCut(b, k, dOf) {
    if (!b.strokeP) return;
    b.strokeP.setAttribute('d', dOf(b));
    if (k <= 0) {
      if (b.cutOn !== false) { b.strokeP.removeAttribute('mask'); b.cutOn = false; }
      return;
    }
    if (b.cutOn !== true) { b.strokeP.setAttribute('mask', b.maskUrl); b.cutOn = true; }
    b.cutP.setAttribute('d', dOf(b.mate));
    if (b.cutK !== k) { b.cutP.setAttribute('fill-opacity', k.toFixed(3)); b.cutK = k; }
    this.fitMask(b);
  }

  // La máscara solo tiene que cubrir el TRAZO DE b, que vive dentro de la caja
  // del propio b (~100x100). La región fija era de 377x582: veintidós veces más
  // superficie que rasterizar en cada frame, y rasterizar máscaras es de lo más
  // caro que hay en un móvil. Se redondea a píxeles enteros para no reescribir
  // los atributos cuando no hace falta.
  fitMask(b) {
    if (!b.maskEl) return;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of b.P) {
      if (p.x < x0) x0 = p.x;
      if (p.x > x1) x1 = p.x;
      if (p.y < y0) y0 = p.y;
      if (p.y > y1) y1 = p.y;
    }
    const M = 12;   // holgura para el abombamiento de la curva y el grosor del trazo
    const X = Math.round(x0 - M), Y = Math.round(y0 - M);
    const W2 = Math.round(x1 - x0 + M * 2), H2 = Math.round(y1 - y0 + M * 2);
    if (b.mx === X && b.my === Y && b.mw === W2 && b.mh === H2) return;
    b.mx = X; b.my = Y; b.mw = W2; b.mh = H2;
    b.maskEl.setAttribute('x', X);
    b.maskEl.setAttribute('y', Y);
    b.maskEl.setAttribute('width', W2);
    b.maskEl.setAttribute('height', H2);
    b.maskRect.setAttribute('x', X);
    b.maskRect.setAttribute('y', Y);
    b.maskRect.setAttribute('width', W2);
    b.maskRect.setAttribute('height', H2);
  }

  paintSupports() {
    if (!this.supportsG || !this.blobs) return;
    const show = this.props.showSupports === true && this.useCradles();
    let d = '';
    if (show) this.blobs.forEach(b => {
      const c = b.cradle;
      const pts = [];
      for (let k = -8; k <= 8; k++) {
        const x = c.cx + c.span * k / 8;
        const dx = x - c.cx;
        if (Math.abs(dx) >= c.R) continue;
        pts.push([x, c.cy + Math.sqrt(c.R * c.R - dx * dx)]);
      }
      if (pts.length) d += 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
    });
    this.supportsG.innerHTML = d
      ? '<' + 'path d="' + d + '" fill="none" stroke="#FF2D95" stroke-width="0.7" stroke-dasharray="3 3"></path>'
      : '';
    if (this.ghostsG) {
      this.ghostsG.innerHTML = this.props.showSupports === true && this.blobs
        ? this.blobs.map(b => '<' + 'circle cx="' + TARGET[b.id][0] + '" cy="' + TARGET[b.id][1] + '" r="' + b.r.toFixed(1)
          + '" fill="none" stroke="#00E5FF" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.65"></circle>').join('')
        : '';
    }
  }

  // Para las llamadas frías (arrastre, medición, dibujo): devuelve objeto nuevo.
  centroid(b) { return this.centroidI(b, { x: 0, y: 0 }); }

  // Misma cuenta, pero escribiendo en un objeto que ya existe. En los bucles
  // calientes el centroide se lee y se tira en el acto, y ahí el {x,y} nuevo
  // era el grueso de la basura del paso físico.
  centroidI(b, o) {
    let x = 0, y = 0;
    for (const p of b.P) { x += p.x; y += p.y; }
    o.x = x / N; o.y = y / N;
    return o;
  }

  capOverlap(bs) {
    const prs = this.capPairs;
    if (!prs) return;
    // con secuencia hay blobs que aún no están liberados y no aparecen en bs:
    // se saltan igual que cuando la pareja se buscaba dentro de bs
    const all = bs === this.blobs;
    for (const pr of prs) {
      const A = pr.A, B = pr.B;
      if (!all && (bs.indexOf(A) < 0 || bs.indexOf(B) < 0)) continue;
      const ca = this.centroidI(A, _cA), cb = this.centroidI(B, _cB);
      const min = OVERLAP * (A.r + B.r) / 2;
      const dx = cb.x - ca.x, dy = cb.y - ca.y, d = hyp(dx, dy) || 1e-6;
      if (d < min) {
        const ov = (min - d) / 2, nx = dx / d, ny = dy / d;
        for (const p of A.P) { p.x -= nx * ov; p.y -= ny * ov; }
        for (const p of B.P) { p.x += nx * ov; p.y += ny * ov; }
      }
    }
  }

  step() {
    const t = this.soft();
    const ks = 0.60 - 0.38 * t, kd2 = 0.22 - 0.16 * t, kShape = 0.35 - 0.30 * t;
    const g = this.grav(), damp = 0.994, fric = 0.25;
    const seq = this.useSequence(), cradles = this.useCradles();
    // sin secuencia el filtro sólo copiaba la lista entera, un array por paso
    const bs = seq ? this.blobs.filter(b => this.frames >= b.seq) : this.blobs;

    const sk = this.settleK();
    // los imanes no existen al principio: primero caída libre y choques entre blobs,
    // después el imán entra con una rampa suave
    const ramp = this.magnetRamp();
    // el imán se escala con la gravedad: si no, a gravedad alta el equilibrio se
    // hunde ~g/k px y el resorte parece no existir
    const kMag = sk > 0 ? 0.0035 * sk * Math.max(1, g / 0.09) * ramp : 0;
    // La captura vive en el propio blob. El diccionario con claves numéricas
    // era un objeto nuevo por paso y forzaba a V8 a modo diccionario.
    for (const b of bs) b.hold = 0;
    if (sk > 0 && ramp > 0) for (const b of bs) {
      const c = this.centroid(b), tg = TARGET[b.id];
      const dist = hyp(tg[0] - c.x, tg[1] - c.y);
      // captura: al acercarse al destino la gravedad se apaga para ese blob
      b.hold = Math.min(1, Math.max(0, 1 - dist / 120)) * Math.min(1, sk * 1.6) * ramp;
    }

    const dg = this.drag;
    for (const b of bs) {
      const gb = (dg && dg.b === b) ? 0 : g * (1 - b.hold * 0.97);
      for (const p of b.P) {
        const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
        p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + gb;
      }
    }

    if (kMag > 0) for (const b of bs) {
      const c = this.centroid(b), tg = TARGET[b.id];
      const fx = (tg[0] - c.x) * kMag, fy = (tg[1] - c.y) * kMag;
      const brake = 1 - 0.10 * b.hold;
      for (const p of b.P) {
        p.x += fx; p.y += fy;
        p.px += (p.x - p.px) * (1 - brake);   // frena al llegar, sin rebote infinito
        p.py += (p.y - p.py) * (1 - brake);
      }
    }

    if (dg) {
      const b = dg.b, c = this.centroid(b), tg = TARGET[b.id];
      const grip = this.props.dragGrip == null ? 0.175 : this.props.dragGrip;
      const leash = this.props.dragLeash == null ? 36 : this.props.dragLeash;
      const stretch = this.props.dragStretch == null ? 0.5 : this.props.dragStretch;
      let wx = dg.x + dg.ox - tg[0], wy = dg.y + dg.oy - tg[1];
      const L = hyp(wx, wy);
      if (L > leash) { const k = leash / L; wx *= k; wy *= k; }   // correa
      const fx = (tg[0] + wx - c.x) * grip, fy = (tg[1] + wy - c.y) * grip;
      for (let i = 0; i < N; i++) {
        // el punto agarrado y sus vecinos tiran más: la piel se estira
        let near = Math.min(Math.abs(i - dg.i), N - Math.abs(i - dg.i));
        const w = 1 + stretch * Math.max(0, 1 - near / 3);
        b.P[i].x += fx * w; b.P[i].y += fy * w;
      }
    }

    for (let it = 0; it < ITERS; it++) {
      for (const b of bs) {
        for (let i = 0; i < N; i++) {
          const a = b.P[i], c = b.P[(i + 1) % N];
          const dx = c.x - a.x, dy = c.y - a.y, d = hyp(dx, dy) || 1e-6;
          const w = (d - b.rest[i]) / d * 0.5 * ks;
          a.x += dx * w; a.y += dy * w; c.x -= dx * w; c.y -= dy * w;
        }
        for (let i = 0; i < N; i++) {
          const a = b.P[i], c = b.P[(i + 2) % N];
          const dx = c.x - a.x, dy = c.y - a.y, d = hyp(dx, dy) || 1e-6;
          const w = (d - b.rest2[i]) / d * 0.5 * kd2;
          a.x += dx * w; a.y += dy * w; c.x -= dx * w; c.y -= dy * w;
        }
        if (kShape > 0.001) {
          // el centroide se congela aquí y se usa como referencia fija mientras
          // se mueven los puntos: no se vuelve a leer, así que vale el rascadero
          const c = this.centroidI(b, _cC);
          let sn = 0, sd = 0;
          for (let i = 0; i < N; i++) {
            const q = b.q0[i], px = b.P[i].x - c.x, py = b.P[i].y - c.y;
            sn += q.x * py - q.y * px; sd += q.x * px + q.y * py;
          }
          const th = Math.atan2(sn, sd), co = Math.cos(th), si = Math.sin(th);
          for (let i = 0; i < N; i++) {
            const q = b.q0[i];
            b.P[i].x += (c.x + q.x * co - q.y * si - b.P[i].x) * kShape;
            b.P[i].y += (c.y + q.x * si + q.y * co - b.P[i].y) * kShape;
          }
        }
        const A = polyArea(b.P);
        let per = 0;
        // normales en buffers de módulo: eran dos arrays nuevos por blob y por
        // iteración, 72 por paso, y sólo viven hasta tres líneas más abajo
        for (let i = 0; i < N; i++) {
          const pr = b.P[(i + N - 1) % N], nx = b.P[(i + 1) % N];
          const tx = nx.x - pr.x, ty = nx.y - pr.y, L = hyp(tx, ty) || 1e-6;
          _NX[i] = ty / L; _NY[i] = -tx / L; per += L / 2;
        }
        const push = (b.A0 - A) / (per || 1) * K_AREA;
        for (let i = 0; i < N; i++) { b.P[i].x += _NX[i] * push; b.P[i].y += _NY[i] * push; }
      }

      for (let i = 0; i < bs.length; i++) for (let j = 0; j < bs.length; j++) {
        if (i === j) continue;
        const A = bs[i], B = bs[j];
        if (allowed(A.id, B.id)) continue;
        const need = GAP + A.bulge + B.bulge + SLACK;
        const cb = this.centroidI(B, _cB), reach = B.r + need + 24;
        // Descarte por pareja: si ni el punto más lejano de A puede alcanzar a
        // B, sobran los 16x16 tests. Es el mismo criterio que el de abajo
        // (desigualdad triangular), así que no cambia ni un resultado.
        //
        // Todas las comparaciones de distancia de este bucle van al cuadrado:
        // son decenas de miles por frame y sólo servían para ordenar o
        // descartar, y como los dos lados son >= 0 la desigualdad se conserva
        // exactamente. La única raíz que queda es una por pareja (far).
        const ca = this.centroidI(A, _cA);
        let far2 = 0;
        for (const p of A.P) {
          const ax = p.x - ca.x, ay = p.y - ca.y, dd = ax * ax + ay * ay;
          if (dd > far2) far2 = dd;
        }
        const lim = reach + Math.sqrt(far2);
        const cdx = ca.x - cb.x, cdy = ca.y - cb.y;
        if (cdx * cdx + cdy * cdy > lim * lim) continue;
        const reach2 = reach * reach, need2 = need * need;
        for (const p of A.P) {
          const px = p.x - cb.x, py = p.y - cb.y;
          if (px * px + py * py > reach2) continue;
          let bd2 = 1e18, bx = 0, by = 0, bk = 0;
          for (let k = 0; k < N; k++) {
            // segNearest en línea: devolvía un objeto por llamada y aquí se
            // llama decenas de miles de veces por frame — esa basura era la
            // que hacía tirones en móvil. La aritmética es idéntica.
            const q = B.P[k], r = B.P[(k + 1) % N];
            const sx0 = r.x - q.x, sy0 = r.y - q.y, SL = sx0 * sx0 + sy0 * sy0 || 1e-9;
            let st = ((p.x - q.x) * sx0 + (p.y - q.y) * sy0) / SL;
            st = st < 0 ? 0 : st > 1 ? 1 : st;
            const sx = q.x + sx0 * st, sy = q.y + sy0 * st;
            const ex = p.x - sx, ey = p.y - sy, dd = ex * ex + ey * ey;
            if (dd < bd2) { bd2 = dd; bx = sx; by = sy; bk = k; }
          }
          const ins = pointInPoly(p.x, p.y, B.P);
          if (!ins && bd2 >= need2) continue;
          let nx = p.x - bx, ny = p.y - by;
          const d = hyp(nx, ny) || 1e-6;
          if (ins) { nx = -nx / d; ny = -ny / d; } else { nx /= d; ny /= d; }
          const mv = ins ? (need + d) : (need - d);
          p.x += nx * mv * 0.7; p.y += ny * mv * 0.7;
          const q = B.P[bk], r = B.P[(bk + 1) % N];
          q.x -= nx * mv * 0.25; q.y -= ny * mv * 0.25;
          r.x -= nx * mv * 0.25; r.y -= ny * mv * 0.25;
        }
      }

      this.capOverlap(bs);

      // cunas invisibles: media-espacio bajo un arco, no puede haber túnel
      if (cradles) for (const b of bs) {
        const c = b.cradle;
        for (const p of b.P) {
          const dx = p.x - c.cx;
          if (Math.abs(dx) > c.span) continue;
          const surf = c.cy + Math.sqrt(Math.max(0, c.R * c.R - dx * dx));
          if (p.y > surf) {
            p.y = surf;
            p.px += (p.x - p.px) * 0.18;   // roza poco: deja resbalar al fondo
          }
        }
      }

      for (const b of bs) for (const p of b.P) {
        if (p.y > FLOOR - SKIN) { p.y = FLOOR - SKIN; p.px += (p.x - p.px) * fric; }
        if (p.x < SKIN) { p.x = SKIN; p.py += (p.y - p.py) * fric; }
        if (p.x > W - SKIN) { p.x = W - SKIN; p.py += (p.y - p.py) * fric; }
      }
      this.capOverlap(bs);
    }

    // ANTI-GIRO: par restaurador hacia la orientación de diseño.
    // Es física (gira posición y velocidad, conserva forma y área), como si
    // el blob tuviera el peso abajo: durante la caída resiste poco, y cuando
    // entra el imán se endereza con firmeza.
    const up = this.uprightK();
    if (up > 0) {
      const kSpin = (0.010 + 0.070 * ramp) * up;
      for (const b of bs) {
        const s = this.spin(b), c = s.c;
        const a = -s.th * kSpin, co = Math.cos(a), si = Math.sin(a);
        for (const p of b.P) {
          let x = p.x - c.x, y = p.y - c.y;
          p.x = c.x + x * co - y * si; p.y = c.y + x * si + y * co;
          x = p.px - c.x; y = p.py - c.y;
          p.px = c.x + x * co - y * si; p.py = c.y + x * si + y * co;
        }
      }
    }
  }

  draw(atRest) {
    const lk = this.labelK();
    // Un solo ringPath por blob y frame. Antes se recalculaba también para el
    // trazo de la fusión y para la máscara de la pareja: 14 trazados por frame
    // en vez de 6, cada uno con ~100 toFixed.
    if (!atRest) for (const b of this.blobs) b.dNow = ringPath(b.P);
    this.drawMerge(atRest ? (b => b.restD) : (b => b.dNow), atRest);
    for (const b of this.blobs) {
      if (atRest) {
        b.shape.setAttribute('d', b.restD);
        b.label.removeAttribute('transform');
        b.lastD = null; b.lastT = null;   // la caché no describe ya lo que hay en el DOM
        continue;
      }
      if (b.dNow !== b.lastD) { b.shape.setAttribute('d', b.dNow); b.lastD = b.dNow; }
      const c = this.centroid(b);
      let P11 = 0, P12 = 0, P21 = 0, P22 = 0, sn = 0, sd = 0;
      for (let i = 0; i < N; i++) {
        const q = b.q0[i], px = b.P[i].x - c.x, py = b.P[i].y - c.y;
        P11 += px * q.x; P12 += px * q.y; P21 += py * q.x; P22 += py * q.y;
        sn += q.x * py - q.y * px; sd += q.x * px + q.y * py;
      }
      const Qi = b.Qi;
      let a11 = P11 * Qi.a + P12 * Qi.b, a12 = P11 * Qi.b + P12 * Qi.d;
      let a21 = P21 * Qi.a + P22 * Qi.b, a22 = P21 * Qi.b + P22 * Qi.d;
      const th = Math.atan2(sn, sd), co = Math.cos(th), si = Math.sin(th);
      a11 = co + (a11 - co) * lk; a12 = -si + (a12 + si) * lk;
      a21 = si + (a21 - si) * lk; a22 = co + (a22 - co) * lk;
      // TOPE DE INCLINACIÓN: la etiqueta nunca pasa de ±labelMaxTilt, así que
      // no puede quedar boca abajo. Los blobs son casi circulares, el
      // desfase con la forma no se lee.
      const tm = this.tiltMax();
      if (tm < Math.PI - 1e-3 && Math.abs(th) > tm) {
        const dth = (th > 0 ? tm : -tm) - th, dc = Math.cos(dth), ds = Math.sin(dth);
        const n11 = dc * a11 - ds * a21, n12 = dc * a12 - ds * a22;
        const n21 = ds * a11 + dc * a21, n22 = ds * a12 + dc * a22;
        a11 = n11; a12 = n12; a21 = n21; a22 = n22;
      }
      const tx = c.x - (a11 * b.c0.x + a12 * b.c0.y);
      const ty = c.y - (a21 * b.c0.x + a22 * b.c0.y);
      // Cada <g data-role="label"> lleva entre 3 y 11 KB de paths de glifos:
      // tocar su matriz los re-rasteriza enteros aunque el valor sea el mismo.
      // Cuando el blob ya está posado el string no cambia y no se escribe nada.
      const tr = 'matrix(' + a11.toFixed(4) + ' ' + a21.toFixed(4) + ' '
        + a12.toFixed(4) + ' ' + a22.toFixed(4) + ' ' + tx.toFixed(2) + ' ' + ty.toFixed(2) + ')';
      if (tr !== b.lastT) { b.label.setAttribute('transform', tr); b.lastT = tr; }
    }
  }

  measure() {
    let sum = 0;
    const per = this.blobs.map(b => {
      const c = this.centroid(b), t = TARGET[b.id];
      const e = hyp(c.x - t[0], c.y - t[1]);
      sum += e;
      return 'b' + b.id + ' ' + e.toFixed(0);
    });
    let mg = 1e9;
    for (let i = 0; i < this.blobs.length; i++) for (let j = i + 1; j < this.blobs.length; j++) {
      const A = this.blobs[i], B = this.blobs[j];
      if (allowed(A.id, B.id)) continue;
      let d = 1e9;
      for (const p of A.P) for (let k = 0; k < N; k++) {
        const q = B.P[k], r = B.P[(k + 1) % N];
        const s = segNearest(p.x, p.y, q.x, q.y, r.x, r.y);
        d = Math.min(d, hyp(p.x - s.x, p.y - s.y));
      }
      // el hueco visible es sobre la curva: descuenta el abombamiento de ambas
      mg = Math.min(mg, d - A.bulge - B.bulge);
    }
    return { mean: sum / this.blobs.length, per: per.join('  '), gap: mg };
  }

  status(txt) { if (this.statusRef.current) this.statusRef.current.textContent = txt; }
  detail(txt) { if (this.detailRef.current) this.detailRef.current.textContent = txt; }

  start() { this.started = true; this.settled = false; this.frames = 0; this.frozen = false; this.tprev = null; this.acc = 0; this.status(this.strategy() + ' · cayendo'); this.kick(); }

  // El bucle solo corre si hay algo que simular: arrancado, en pantalla y en
  // movimiento. Cualquiera de las tres condiciones que falle lo para.
  kick() {
    if (this.stopped || this.raf) return;
    if (!this.started || this.offscreen || this.frozen) return;
    this.raf = requestAnimationFrame(this.loop);
  }

  wake() { this.restSnap = null; this.frozen = false; this.tprev = null; this.acc = 0; this.kick(); }

  // ¿Está quieto? Nadie se ha alejado más de REST_EPS px de donde estaba hace
  // REST_WIN frames. Durante la caída el desvío es de decenas de px; una vez
  // posado sólo queda un temblor numérico de ~0,01 px. Con 0,05 px en 90
  // frames el congelado ocurre como mucho a 0,05 px del punto de equilibrio:
  // la veinteava parte de un píxel de pantalla.
  //
  // No sirve el criterio de `settled` (|p - p.prev| < 0,05): ese valor es el
  // residuo del solver de restricciones, no movimiento real, y se queda
  // clavado en ~0,2 para siempre.
  atRest() {
    const REST_EPS = 0.05, REST_WIN = 90;
    const snap = this.restSnap;
    if (!snap || snap.length !== this.blobs.length) { this.snapRest(); return false; }
    for (let i = 0; i < this.blobs.length; i++) {
      const P = this.blobs[i].P, S = snap[i];
      for (let k = 0; k < N; k++) {
        if (hyp(P[k].x - S[k * 2], P[k].y - S[k * 2 + 1]) > REST_EPS) { this.snapRest(); return false; }
      }
    }
    return this.frames - this.restFrame >= REST_WIN;
  }

  snapRest() {
    this.restFrame = this.frames;
    // Se llama en cada frame mientras algo se mueva: los buffers se reutilizan
    // en vez de tirar seis Float64Array por frame.
    let snap = this.restSnap;
    if (!snap || snap.length !== this.blobs.length) {
      snap = this.restSnap = this.blobs.map(() => new Float64Array(N * 2));
    }
    for (let i = 0; i < this.blobs.length; i++) {
      const P = this.blobs[i].P, a = snap[i];
      for (let k = 0; k < N; k++) { a[k * 2] = P[k].x; a[k * 2 + 1] = P[k].y; }
    }
  }

  onReplay = () => {
    if (!this.blobs) return;
    this.blobs.forEach(b => {
      RINGS.find(r => r.id === b.id).ring.forEach((pt, i) => {
        b.P[i].x = pt[0]; b.P[i].y = pt[1]; b.P[i].px = pt[0]; b.P[i].py = pt[1];
      });
    });
    this.started = false;
    this.frames = 0;
    this.draw(true);
    this.status('listo');
    this.detail('');
    setTimeout(() => { if (!this.stopped) this.start(); }, 260);
  };

  loop = (now) => {
    if (this.stopped) return;
    this.raf = 0;
    if (this.started) {
      // Paso fijo de 1/60 s con acumulador. Antes se avanzaba un paso por
      // frame, así que en un móvil a 25 fps la caída duraba el doble y se
      // veía a cámara lenta. Ahora el reloj manda, con un tope de 3 pasos
      // por frame para no hundir más un dispositivo que ya va justo.
      const DT = 1000 / 60, MAXSTEPS = 3;
      const t = typeof now === 'number' ? now : (this.tprev || 0) + DT;
      if (this.tprev == null) this.tprev = t - DT;
      let acc = (this.acc || 0) + Math.min(200, t - this.tprev);
      this.tprev = t;
      let n = 0;
      while (acc >= DT && n < MAXSTEPS) { this.step(); this.frames++; acc -= DT; n++; }
      // Antes, si un frame se pasaba de tiempo (p. ej. el recálculo de estilo del
      // cruce), se agotaban los 3 pasos y el resto del tiempo simulado SE TIRABA.
      // Eso no hace la caída más lenta: le borra trozos, y eso es justo lo que se
      // ve como tirón. Ahora se guarda hasta dos frames de deuda y se recupera en
      // los siguientes, que es lo que el ojo lee como continuo.
      this.acc = acc > DT * 2 ? DT * 2 : acc;
      if (!n) return this.kick();
      this.draw(false);
      if (!this.settled && this.frames > 140) {
        let moving = 0;
        for (const b of this.blobs) for (const p of b.P) moving = Math.max(moving, hyp(p.x - p.px, p.y - p.py));
        if (moving < 0.05) {
          this.settled = true;
          const m = this.measure();
          this.status(this.strategy() + ' · desvío medio ' + m.mean.toFixed(0) + 'px');
          this.detail(m.per + '   ·   hueco mín ' + m.gap.toFixed(1) + 'px');
        }
      }
      // Posado: se duerme en vez de seguir simulando a 60 fps para siempre
      // (era lo que fundía el móvil al llegar a esta sección).
      if (!this.drag && this.frames > 140 && this.atRest()) this.frozen = true;
    }
    this.kick();
  };

  renderVals() {
    return { rootRef: this.rootRef, statusRef: this.statusRef, detailRef: this.detailRef, onReplay: this.onReplay };
  }
}
</script>
