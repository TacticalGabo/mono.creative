<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  a { color: #d8d3c7; }
  a:hover { color: #ffffff; }
</style>
</helmet>
<div ref="{{ rootRef }}" style="position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible">
  <svg viewBox="-20 -102 756 504" shape-rendering="geometricPrecision" style="position:absolute;left:-2.793%;top:-34.46%;width:105.59%;height:auto;display:block;overflow:visible">
    <g ref="{{ groupRef }}">
      <path ref="{{ blobRef }}" d="" fill="currentColor"></path>
    </g>
  </svg>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;cycleSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:7,&quot;min&quot;:3,&quot;max&quot;:14,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animación&quot;},&quot;fps&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:12,&quot;min&quot;:8,&quot;max&quot;:60,&quot;step&quot;:1,&quot;unit&quot;:&quot;fps&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animación&quot;},&quot;handDrawn&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animación&quot;},&quot;detail&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:9,&quot;min&quot;:5,&quot;max&quot;:24,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animación&quot;},&quot;shapeColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B8FF00&quot;,&quot;options&quot;:[&quot;#B8FF00&quot;,&quot;#f4f1ea&quot;,&quot;#FF0000&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Color&quot;}}">
const BLOBS = [
  { cx: 116, cy: 148, rx: 116, ry: 148, arc: 26, delay: 0.10, wob: 1.0 },
  { cx: 302, cy: 148, rx: 116, ry: 148, arc: -18, delay: 0.17, wob: 1.35 },
  { cx: 595.5, cy: 148, rx: 120.5, ry: 148, arc: -34, delay: 0.0, wob: 0.8 }
];
// el blob fusionado tiene la forma y el tamaño del blob suelto de la derecha
const TARGET = { cx: 358, cy: 148, rx: 120.5, ry: 148 };
// 1) al entrar el cursor las masas se funden  2) al salir vuelven a separarse
const IN_DUR = 0.9, OUT_DUR = 0.8;
// malla de la fusión: la unión suave es geometría, no un filtro
const GRID = { x0: -60, y0: -60, x1: 780, y1: 356, cell: 4 };
const K_BLEND = 62;

const CASES = {
  1: [['l', 'b']], 2: [['b', 'r']], 3: [['l', 'r']], 4: [['t', 'r']],
  5: [['l', 't'], ['b', 'r']], 6: [['t', 'b']], 7: [['l', 't']], 8: [['t', 'l']],
  9: [['t', 'b']], 10: [['t', 'r'], ['l', 'b']], 11: [['t', 'r']], 12: [['l', 'r']],
  13: [['b', 'r']], 14: [['l', 'b']]
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.t0 = null;
    this.lastFrame = -1;
    this.t = 0;
    this.hovering = false;
    this.settled = -1;
    this.nx = Math.round((GRID.x1 - GRID.x0) / GRID.cell) + 1;
    this.ny = Math.round((GRID.y1 - GRID.y0) / GRID.cell) + 1;
    this.field = new Float32Array(this.nx * this.ny);
  }

  componentDidMount() {
    this.loop = this.loop.bind(this);
    this.raf = requestAnimationFrame(this.loop);
    this.watchVisibility();
    const host = (this.rootEl && this.rootEl.parentElement) || this.rootEl;
    if (host) {
      this.host = host;
      // el hover solo cuenta en desktop; por debajo de 768 px manda el toque.
      // La MediaQueryList se crea una sola vez: es reactiva, y fabricarla en
      // cada evento de puntero era trabajo tirado. El ancho sí se lee al vuelo
      // porque el punto de corte tiene que evaluarse en el momento.
      const mq = window.matchMedia ? window.matchMedia('(hover:hover) and (pointer:fine)') : null;
      const fine = () => !!mq && mq.matches && window.innerWidth >= 768;
      this.fine = fine;
      // se guardan las funciones que de verdad se registran: antes se quitaban
      // otras distintas, así que los listeners sobrevivían al desmontaje
      this.hoverIn = () => { if (fine()) this.hovering = true; };
      this.hoverOut = () => { if (fine()) this.hovering = false; };
      host.addEventListener('mouseenter', this.hoverIn);
      host.addEventListener('mouseleave', this.hoverOut);
      // toque: cambia de estado, se mantiene 0,6 s y navega si hay enlace
      this.onTap = (e) => {
        if (fine() || this.tapTimer) return;
        const link = host.getAttribute('data-href') || (host.parentElement && host.parentElement.getAttribute('data-href'));
        if (link) e.preventDefault();
        this.hovering = true;
        this.tapTimer = setTimeout(() => {
          this.hovering = false;
          this.tapTimer = null;
          if (link) window.location.href = link;
        }, IN_DUR * 1000 + 600);
      };
      host.addEventListener('click', this.onTap);
    }
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
    if (this.host) {
      this.host.removeEventListener('mouseenter', this.hoverIn);
      this.host.removeEventListener('mouseleave', this.hoverOut);
      if (this.onTap) this.host.removeEventListener('click', this.onTap);
      if (this.tapTimer) clearTimeout(this.tapTimer);
    }
  }



  // Fuera de pantalla no se dibuja nada. Estos campos de fusión (canvas +
  // desenfoque + marching squares) son lo más caro de la página y seguían
  // reconstruyéndose aunque el componente estuviera lejos del viewport o
  // en display:none. El reloj no se toca: al volver, la animación aparece
  // donde le tocaba, no reiniciada.
  watchVisibility() {
    const ref = this.rootEl || this.shape || this.blob || this.sampleEl || this.group;
    if (!ref || typeof IntersectionObserver !== 'function') return;
    let node = ref.ownerSVGElement || ref;
    node = node.parentElement || node;
    this.visible = true;
    this.io = new IntersectionObserver((es) => {
      for (const e of es) this.visible = e.isIntersecting;
      // el SVG está en position:absolute con overflow:visible y sobresale mucho
      // de la caja observada (top:-34%): con 150 px se congelaba estando a la vista
    }, { rootMargin: '400px' });
    this.io.observe(node);
  }

  renderVals() {
    const set = (k) => (el) => { this[k] = el; };
    return {
      rootRef: set('rootEl'), groupRef: set('group'), blobRef: set('blob')
    };
  }

  clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  spring(p) { return p >= 1 ? 1 : 1 - Math.exp(-6.0 * p) * Math.cos(5.6 * p); }
  easeInOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

  buildField(ovals, k) {
    const f = this.field, cell = GRID.cell, nx = this.nx, ny = this.ny;
    for (let j = 0; j < ny; j++) {
      const y = GRID.y0 + j * cell, row = j * nx;
      for (let i = 0; i < nx; i++) {
        const x = GRID.x0 + i * cell;
        let s = -1e9;
        for (let o = 0; o < ovals.length; o++) {
          const v = ovals[o];
          const dx = (x - v.cx) / v.rx, dy = (y - v.cy) / v.ry;
          const si = (1 - Math.sqrt(dx * dx + dy * dy)) * (v.rx < v.ry ? v.rx : v.ry);
          if (k <= 0.01) { if (si > s) s = si; }
          else {
            const m = si > s ? si : s;
            const h = Math.max(k - Math.abs(si - s), 0) / k;
            s = m + h * h * k * 0.25;
          }
        }
        f[row + i] = s;
      }
    }
  }

  contours() {
    const f = this.field, nx = this.nx, ny = this.ny, cell = GRID.cell;
    const pts = new Map(), adj = new Map();
    const HK = nx * ny;
    const ptOn = (key, ax, ay, bx, by, va, vb) => {
      if (!pts.has(key)) {
        const t = va / (va - vb);
        pts.set(key, [ax + (bx - ax) * t, ay + (by - ay) * t]);
      }
      return key;
    };
    const link = (a, b) => {
      if (!adj.has(a)) adj.set(a, []);
      if (!adj.has(b)) adj.set(b, []);
      adj.get(a).push(b);
      adj.get(b).push(a);
    };
    // antes se fabricaba un objeto con cuatro closures por cada celda de
    // contorno: miles de allocaciones por frame para nada. Misma aritmética y
    // mismo orden de evaluación, sin reservar memoria.
    const edgePt = (which, i, j, x0, y0, x1, y1, v00, v10, v11, v01) => {
      switch (which) {
        case 't': return ptOn(j * nx + i, x0, y0, x1, y0, v00, v10);
        case 'b': return ptOn((j + 1) * nx + i, x0, y1, x1, y1, v01, v11);
        case 'l': return ptOn(HK + j * nx + i, x0, y0, x0, y1, v00, v01);
        default: return ptOn(HK + j * nx + i + 1, x1, y0, x1, y1, v10, v11);
      }
    };
    for (let j = 0; j < ny - 1; j++) {
      for (let i = 0; i < nx - 1; i++) {
        const v00 = f[j * nx + i], v10 = f[j * nx + i + 1];
        const v11 = f[(j + 1) * nx + i + 1], v01 = f[(j + 1) * nx + i];
        const idx = (v00 > 0 ? 8 : 0) | (v10 > 0 ? 4 : 0) | (v11 > 0 ? 2 : 0) | (v01 > 0 ? 1 : 0);
        if (idx === 0 || idx === 15) continue;
        const x0 = GRID.x0 + i * cell, y0 = GRID.y0 + j * cell;
        const x1 = x0 + cell, y1 = y0 + cell;
        const segs = CASES[idx];
        for (let k = 0; k < segs.length; k++) {
          const s = segs[k];
          link(edgePt(s[0], i, j, x0, y0, x1, y1, v00, v10, v11, v01),
               edgePt(s[1], i, j, x0, y0, x1, y1, v00, v10, v11, v01));
        }
      }
    }
    const seen = new Set(), loops = [];
    for (const start of adj.keys()) {
      if (seen.has(start)) continue;
      const loop = [];
      let cur = start, prev = null;
      while (cur !== undefined && !seen.has(cur)) {
        seen.add(cur);
        loop.push(pts.get(cur));
        const ns = adj.get(cur) || [];
        let next;
        for (const n of ns) { if (n !== prev && !seen.has(n)) { next = n; break; } }
        prev = cur;
        cur = next;
      }
      if (loop.length > 8) loops.push(loop);
    }
    return loops;
  }

  resample(loop, spacing) {
    const n = loop.length, seg = [];
    let total = 0;
    for (let i = 0; i < n; i++) {
      const a = loop[i], b = loop[(i + 1) % n];
      // hypot escala contra desbordamiento, que aquí no puede pasar, y en V8 sale
      // varias veces más caro
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.sqrt(dx * dx + dy * dy);
      seg.push(len);
      total += len;
    }
    const m = Math.max(24, Math.min(220, Math.round(total / spacing)));
    const out = [];
    let si = 0, sacc = 0;
    for (let i = 0; i < m; i++) {
      const target = (i / m) * total;
      while (sacc + seg[si] < target && si < n - 1) { sacc += seg[si]; si++; }
      const a = loop[si], b = loop[(si + 1) % n];
      const t = seg[si] > 0 ? (target - sacc) / seg[si] : 0;
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
    return out;
  }

  curvePath(p) {
    const n = p.length;
    if (n < 3) return '';
    let d = 'M' + p[0][0].toFixed(1) + ' ' + p[0][1].toFixed(1);
    for (let i = 0; i < n; i++) {
      const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
      d += 'C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) +
           ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) +
           ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d + 'Z';
  }

  loop(now) {
    this.raf = requestAnimationFrame(this.loop);
    if (this.visible === false) return;
    if (this.t0 === null) this.t0 = now;

    const boilAmt = this.props.handDrawn ?? 0;
    const detail = this.props.detail ?? 9;
    const fps = this.props.fps ?? 12;

    const elapsed = (now - this.t0) / 1000;
    const frame = Math.floor(elapsed * fps);
    if (frame === this.lastFrame) return;
    this.lastFrame = frame;
    const bt = frame / fps;
    // t: 0 = tres masas · 1 = masa única. Lo gobierna el hover.
    const dir = this.hovering ? 1 : -1;
    const target = this.hovering ? 1 : 0;
    const step = (1 / fps) / (this.hovering ? IN_DUR : OUT_DUR);
    if (this.t < target) this.t = Math.min(target, this.t + step);
    else if (this.t > target) this.t = Math.max(target, this.t - step);
    const t = this.t;
    if ((t === 0 || t === 1) && this.settled === t) return;
    this.settled = (t === 0 || t === 1) ? t : -1;

    let overshoot = 0;
    const ovals = [];
    for (let i = 0; i < BLOBS.length; i++) {
      const b = BLOBS[i];
      const q = this.clamp01((t - b.delay) / (1 - b.delay));
      const e = dir > 0 ? this.spring(q) : this.easeInOut(q);
      overshoot = Math.max(overshoot, e - 1);
      const w = boilAmt * (1 - 0.65 * e) * b.wob;
      ovals.push({
        cx: b.cx + (TARGET.cx - b.cx) * e + Math.sin(bt * 1.9 + i * 2.1) * 4.5 * w,
        cy: b.cy + (TARGET.cy - b.cy) * e + Math.sin(Math.PI * q) * b.arc + Math.cos(bt * 1.5 + i * 1.3) * 3.5 * w,
        rx: Math.max(8, b.rx + (TARGET.rx - b.rx) * e + Math.sin(bt * 2.4 + i * 0.7) * 4 * w),
        ry: Math.max(8, b.ry + (TARGET.ry - b.ry) * e - Math.sin(bt * 2.4 + i * 0.7) * 3.2 * w)
      });
    }

    this.buildField(ovals, K_BLEND * Math.pow(1 - this.clamp01(t), 2));
    let d = '';
    for (const loop of this.contours()) d += this.curvePath(this.resample(loop, detail));
    // escribir el mismo string invalida el subárbol SVG para nada
    if (d && this.blob && d !== this.lastD) { this.blob.setAttribute('d', d); this.lastD = d; }

    if (this.group) {
      const s = overshoot * 0.9;
      // con overshoot 0, que es la mayor parte del recorrido, el transform sale
      // idéntico frame tras frame
      const tr = 'translate(' + TARGET.cx + ' ' + TARGET.cy + ') scale(' + (1 + s).toFixed(4) + ' ' + (1 - s).toFixed(4) + ') translate(' + (-TARGET.cx) + ' ' + (-TARGET.cy) + ')';
      if (tr !== this.lastTr) { this.group.setAttribute('transform', tr); this.lastTr = tr; }
    }
  }
}

</script>
</body>
</html>
