        var inside=dx===0&&dy===0;
        var d2=dx*dx+dy*dy;
        var p=inside?1:(d2<=ZONE*ZONE?1-Math.sqrt(d2)/ZONE:0);
        if(p>0)any_near=p>any_near?p:any_near;
        if(!(b===focused&&!inside))set(b,inside);
        if(FINEnow())goo(b,p,ev.x,ev.y);
      }
      window.__mcGooNear=any_near;
    }
    function schedule(){ if(!FINEnow())return; if(!tick)tick=requestAnimationFrame(frame); }
    document.addEventListener('mousemove',function(e){
      if(!FINEnow())return;
      ev={x:e.clientX,y:e.clientY};
      schedule();
    },{passive:true});
    window.addEventListener('scroll',function(){ if(ev)schedule(); },{passive:true});
    window.addEventListener('resize',function(){ if(ev)schedule(); },{passive:true});
    document.addEventListener('mouseleave',function(){
      ev=null; window.__mcGooNear=0;
      schedule();
    });
    document.addEventListener('focusin',function(e){
      var b=e.target.closest&&e.target.closest('.btn');
      if(b){focused=b; set(b,true);}
    });
    document.addEventListener('focusout',function(e){
      var b=e.target.closest&&e.target.closest('.btn');
      if(b){if(focused===b)focused=null; set(b,false); schedule();}
    });
    // ratón/trackpad: un .btn con data-href navega al hacer clic (en táctil lo
    // hace el bloque de abajo, tras la animación del tap)
    document.addEventListener('click',function(e){
      if(!FINEnow())return;
      var hb=e.target.closest&&e.target.closest('.btn[data-href]');
      if(hb){ e.preventDefault(); go(hb); }
    });
    // Precarga del destino en cuanto el puntero o el dedo llegan al botón: al
    // hacer clic la página ya está bajada y el salto es inmediato.
    function precarga(e){
      var hb=e.target.closest&&e.target.closest('.btn[data-href]');
      if(!hb||hb.dataset.pf)return;
      hb.dataset.pf='1';
      var u=hb.getAttribute('data-href'), lst=[u];
      if(/contact\.html/.test(u))lst=lst.concat(['./css/contact.css','./js/contact.js','./js/contact-rules.js','./js/contact-config.js']);
      lst.forEach(function(h){ var l=document.createElement('link'); l.rel='prefetch'; l.href=h; document.head.appendChild(l); });
    }
    document.addEventListener('pointerover',precarga,{passive:true});
    document.addEventListener('touchstart',precarga,{passive:true});
    document.addEventListener('keydown',function(e){
      if(e.key!=='Enter'&&e.key!==' ')return;
      var hb=e.target.closest&&e.target.closest('.btn[data-href]');
      if(hb){ e.preventDefault(); go(hb); }
    });
    document.addEventListener('click',function(e){
      if(FINEnow())return;
      var link=e.target.closest&&e.target.closest('.slink');
      if(link){
        var lh=link.getAttribute('data-href');
        if(lh){ e.preventDefault(); window.open(lh,'_blank','noopener'); }
        return;
      }
      var oval=e.target.closest&&e.target.closest('.oval');
      if(oval){
        var onv=oval.classList.contains('tap');
        Array.prototype.forEach.call(document.querySelectorAll('.oval.tap'),function(o){o.classList.remove('tap');});
        if(!onv){
          oval.classList.add('tap');
          setTimeout(function(){oval.classList.remove('tap');},1000);
        }
        return;
      }
      var card=e.target.closest&&e.target.closest('.card');
      if(card){
        var on=card.classList.contains('tap');
        Array.prototype.forEach.call(document.querySelectorAll('.card.tap'),function(c){c.classList.remove('tap');});
        if(!on)card.classList.add('tap');
        return;
      }
      var b=e.target.closest&&e.target.closest('.btn');
      if(!b||b.dataset.tapping)return;
      // enlace a otra página: salto inmediato, sin esperar la animación del tap
      if(b.getAttribute('data-href')&&!b.getAttribute('data-scroll')){ e.preventDefault(); go(b); return; }
      e.preventDefault();
      b.dataset.tapping='1';
      set(b,true);
      setTimeout(function(){
        delete b.dataset.tapping;
        var sel=b.getAttribute('data-scroll'), href=b.getAttribute('data-href')||b.getAttribute('href');
        if(sel){
          var t=document.querySelector(sel);
          if(t)window.scrollTo({top:t.getBoundingClientRect().top+window.pageYOffset-32,behavior:'smooth'});
        } else if(href){ window.location.href=href; }
        set(b,false);
      },400);
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script>
(function(){
  if(window.__mcCursor)return; window.__mcCursor=1;
  function init(){
    var page=document.querySelector('.page');
    if(!page||document.querySelector('x-dc'))return setTimeout(init,120);
    // El punto verde solo existe en desktop con ratón. En un teléfono el toque
    // genera un mousemove sintético y el punto aparecía y se quedaba puesto,
    // estorbando. Aquí ni siquiera se crea el elemento.
    var fine=function(){
      return !!(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches)
        && window.innerWidth>=768;
    };
    var d=null;
    function dot(){
      if(d)return d;
      d=document.createElement('div'); d.id='cursor-dot';
      document.body.appendChild(d);
      return d;
    }
    document.addEventListener('mousemove',function(e){
      if(!fine()){ if(d)d.style.opacity='0'; return; }
      var el=dot();
      el.style.transform='translate3d('+e.clientX+'px,'+e.clientY+'px,0) translate(-50%,-50%)';
      el.style.opacity=e.target&&e.target.closest&&e.target.closest('.page')?(1-(window.__mcGooNear||0)).toFixed(3):'0';
    });
    document.addEventListener('mouseleave',function(){if(d)d.style.opacity='0';});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
